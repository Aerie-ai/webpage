name: Aerie sample enquiry demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/**'
      - 'sample_data/**'
      - 'index.html'
      - 'privacy.html'
      - 'README.md'
      - 'docs/**'
      - 'Job_Quote_Calculator_DEMO.xlsx'
      - 'pilot/**'
      - 'studio/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/aerie-demo.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'sample_data/**'
      - 'index.html'
      - 'privacy.html'
      - 'README.md'
      - 'docs/**'
      - 'Job_Quote_Calculator_DEMO.xlsx'
      - 'pilot/**'
      - 'studio/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/aerie-demo.yml'

permissions:
  contents: read

jobs:
  test-demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (verified upstream)
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6 (verified upstream)
        with:
          python-version: '3.12'
      - name: Test agent
        run: python -m unittest discover -s agent -p 'test_*.py' -v
      - name: Test static Aerie Lab locally (built-in Node test runner)
        run: node --test tests/*.test.cjs
      - name: Measure local-first synthetic work and static source budget
        run: node tools/measure_demo.cjs
      - name: Process fictional enquiries
        run: python agent/run.py
      - name: Evaluate realistic fictional client cases
        run: python agent/mock_client_evaluation.py
      - name: Upload offline review dashboard and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (verified upstream)
        with:
          name: aerie-review-report
          path: |
            output/report.json
            output/dashboard.html
            output/summary.md
            output/mock_clients_results.json
            output/efficiency_baseline.json
            output/mock_clients_results.md
            output/mock_clients_dashboard.html
          retention-days: 7
